<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Game 64x64</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Conway's Life Game</h1>

  <div class="controls">
    <button id="randomBtn">Random</button>
    <button id="gliderBtn">Gliders</button>
    <button id="galaxyBtn">galaxies</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="board" width="320" height="320"></canvas>
  </div>

  <label class="speed-label">
    Speed
    <input type="range" id="speedSlider" min="1" max="60" value="10">
    <span id="speedValue">10</span> fps
  </label>

  <div class="action-controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="stepBtn">Step</button>
  </div>

  <div class="generation-row">
    <span id="genCounter">Generation: 0</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
